<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      GreenCare Clinic | Trusted Healthcare & Medical Services
    </title>

    <meta
      name="description"
      content="GreenCare Clinic provides professional healthcare services, experienced doctors, preventive care, health screening, and convenient appointments for individuals and families."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#2563eb"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="GreenCare Clinic | Trusted Healthcare & Medical Services"
    />

    <meta
      property="og:description"
      content="Professional healthcare services, experienced doctors, preventive care, health screening, and convenient appointments at GreenCare Clinic."
    />

    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <!-- Change this to your real deployed URL -->
    <meta
      property="og:url"
      content="https://greencare-clinic.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="GreenCare Clinic"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="GreenCare Clinic | Trusted Healthcare & Medical Services"
    />

    <meta
      name="twitter:description"
      content="Professional healthcare services, experienced doctors, preventive care, health screening, and convenient appointments."
    />

    <meta
      name="twitter:image"
      content="/og-image.jpg"
    />

    <!-- Canonical URL -->
    <!-- Replace with your actual Vercel/custom domain -->
    <link
      rel="canonical"
      href="https://greencare-clinic.vercel.app/"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
